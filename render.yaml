services:

  - type: web
    name: camouflage-breaker-ai
    runtime: python
    region: singapore
    plan: 1c-2g
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ai_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      - key: CAMOUFLAGE_SEGMENTATION_MODEL_URL
        value: https://github.com/Dhanush-S-007/Camouflage_Breaker/releases/download/v1.0-models/sinetv2_cod10k_40epoch_best.pth

      - key: CAMOUFLAGE_CLASSIFIER_MODEL_URL
        value: https://github.com/Dhanush-S-007/Camouflage_Breaker/releases/download/v1.0-models/classifier_best.pth

  - type: web
    name: camouflage-breaker-web
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: camouflage-breaker-ai
          property: hostport
